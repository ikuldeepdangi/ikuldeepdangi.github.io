<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="robots" content="noindex" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kuldeep Dangi — v5 Brutal</title>
<meta name="description" content="Kuldeep Dangi — Software Engineer building voice AI, LLM systems and full-stack products." />
<link rel="icon" href="/assets/img/favicon/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#fff6d6;--ink:#111;--y:#ffd400;--p:#ff5ea8;--b:#3d7bff;--g:#20c46b;--sh:6px 6px 0 var(--ink)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.5 "Space Grotesk",system-ui,sans-serif;padding-bottom:96px;overflow-x:hidden;background-image:radial-gradient(#11111122 1px,transparent 1px);background-size:22px 22px}
h1,h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}a{color:inherit}
.w{max-width:1200px;margin:0 auto;padding:0 clamp(16px,3vw,32px)}
.box{background:#fff;border:3px solid var(--ink);box-shadow:var(--sh);border-radius:14px}
.mono{font:700 13px/1.3 "Space Mono",monospace;text-transform:uppercase}
.big{font-family:"Archivo Black",sans-serif;font-weight:400;letter-spacing:-.02em;line-height:.92;text-transform:uppercase}
nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding:12px 16px;position:sticky;top:12px;z-index:9}
nav .l{display:flex;gap:8px;flex-wrap:wrap}nav .l a{text-decoration:none;padding:6px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--bg)}nav .l a:hover{background:var(--y)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border:3px solid var(--ink);box-shadow:var(--sh);border-radius:12px;font:700 17px/1 "Space Grotesk";text-decoration:none;transition:transform .12s,box-shadow .12s;background:var(--y);cursor:pointer}
.btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.hero{position:relative;margin-top:40px;padding:clamp(24px,5vw,56px)}
.hero h1{font-size:clamp(52px,10vw,148px)}
.hl{background:var(--p);padding:0 .12em;border:3px solid var(--ink);display:inline-block;transform:rotate(-2deg);margin:6px 0}
.hero p{max-width:60ch;font-size:19px;margin-top:28px}
.badge{position:absolute;right:clamp(12px,4vw,48px);top:-34px;width:132px;height:132px;animation:rot 14s linear infinite}
.badge text{font:700 12.5px "Space Mono";letter-spacing:2px}
@keyframes rot{to{transform:rotate(360deg)}}
.stk{display:inline-block;padding:6px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--g);color:#fff;margin-bottom:22px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:28px}.stats .box{padding:22px}.stats b{font:400 clamp(40px,5vw,64px)/1 "Archivo Black"}
.stats .box:nth-child(1){background:var(--y)}.stats .box:nth-child(2){background:var(--b);color:#fff}.stats .box:nth-child(3){background:var(--p)}.stats .box:nth-child(4){background:var(--g);color:#fff}
section{margin-top:110px}.sh{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px;flex-wrap:wrap}.sh h2{font-size:clamp(44px,7vw,96px)}
.cases{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.case{padding:28px;display:flex;flex-direction:column;gap:12px;transition:transform .15s}.case:nth-child(odd){transform:rotate(-.6deg)}.case:nth-child(even){transform:rotate(.6deg)}.case:hover{transform:rotate(0) translate(-3px,-3px)}
.case h3{font:400 clamp(34px,4vw,48px)/1 "Archivo Black";text-transform:uppercase}
.case .k{align-self:flex-start;padding:4px 10px;border:2px solid var(--ink);border-radius:8px;background:var(--y)}
.case .imp{margin-top:auto;padding:12px 14px;border:2px dashed var(--ink);border-radius:10px;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px}.tags span{font:700 12px "Space Mono";padding:4px 8px;border:2px solid var(--ink);border-radius:6px;background:var(--bg)}
.pl{margin-top:28px;padding:8px 24px}.pl li{display:grid;grid-template-columns:1fr 2fr auto;gap:16px;padding:14px 0;border-bottom:2px solid var(--ink)}.pl li:last-child{border:0}
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.svc .box{padding:24px}.svc h3{font:400 24px/1.05 "Archivo Black";text-transform:uppercase;margin:12px 0 10px}
.svc .box:nth-child(4n+1) .n{background:var(--p)}.svc .box:nth-child(4n+2) .n{background:var(--b);color:#fff}.svc .box:nth-child(4n+3) .n{background:var(--g);color:#fff}.svc .box:nth-child(4n+4) .n{background:var(--y)}
.n{display:inline-grid;place-items:center;width:40px;height:40px;border:2px solid var(--ink);border-radius:50%;font:700 14px "Space Mono"}
.xp{display:grid;gap:18px}.xp .box{padding:24px 28px;display:grid;grid-template-columns:220px 1fr;gap:20px}.xp h3{font-size:24px;font-weight:700}
.xp ul{margin-top:10px;display:grid;gap:6px}.xp ul li{padding-left:22px;position:relative}.xp ul li::before{content:"✦";position:absolute;left:0;color:var(--p)}
.ct{background:var(--ink);color:var(--bg);padding:clamp(28px,6vw,72px);border-radius:18px;box-shadow:10px 10px 0 var(--p)}
.ct h2{font-size:clamp(48px,9vw,128px)}.ct .btn{margin-top:32px;font-size:clamp(14px,2.4vw,22px);word-break:break-all}
.ct .lk{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.ct .lk a{padding:8px 14px;border:2px solid var(--bg);border-radius:999px;text-decoration:none}.ct .lk a:hover{background:var(--bg);color:var(--ink)}
@media(max-width:900px){.stats,.svc{grid-template-columns:1fr 1fr}.cases{grid-template-columns:1fr}.xp .box{grid-template-columns:1fr;gap:6px}.pl li{grid-template-columns:1fr;gap:4px}nav .l{display:none}.badge{width:96px;height:96px;top:-28px}}
@media(max-width:520px){.stats,.svc{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.badge{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="/assets/data.js"></script>
<script>
(function(){
const P=window.PROFILE,pad=n=>String(n).padStart(2,"0");
document.getElementById("app").innerHTML=`<div class="w">
<nav class="box"><strong class="big" style="font-size:20px">KD.</strong><div class="l mono"><a href="#work">Work</a><a href="#xp">Experience</a><a href="${P.links.resume}" target="_blank" rel="noopener">Résumé</a><a href="#contact">Contact</a></div></nav>
<header class="box hero">
<svg class="badge" viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="68" fill="#ffd400" stroke="#111" stroke-width="3"/><path id="cp" d="M70,70 m-50,0 a50,50 0 1,1 100,0 a50,50 0 1,1 -100,0" fill="none"/><text><textPath href="#cp">AVAILABLE FOR WORK ✦ AVAILABLE FOR WORK ✦</textPath></text><text x="70" y="78" text-anchor="middle" style="font:400 22px 'Archivo Black'">AI</text></svg>
<span class="stk mono">● ${P.role} · ${P.location}</span>
<h1 class="big">I build AI<br>that <span class="hl">listens,</span><br>reads &amp; talks back.</h1>
<p>${P.intro}</p>
<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:32px"><a class="btn" href="mailto:${P.email}?subject=Project%20enquiry">Start a project →</a><a class="btn" style="background:#fff" href="#work">See the work</a></div>
</header>
<div class="stats">${P.stats.map(s=>`<div class="box"><b>${s.value}</b><p class="mono" style="margin-top:8px">${s.label}</p></div>`).join("")}</div>

<section id="work"><div class="sh"><h2 class="big">Selected<br>work</h2><p class="mono">${P.cases.length} case studies ↓</p></div>
<div class="cases">${P.cases.map((c,i)=>`<article class="box case"><span class="k mono">${pad(i+1)} · ${c.kind}</span><h3>${c.name}</h3><p><b>${c.tagline}.</b> ${c.problem}</p><p>${c.approach}</p><p class="imp">⚡ ${c.impact}</p><div class="tags">${c.stack.map(s=>`<span>${s}</span>`).join("")}</div></article>`).join("")}</div>
<ul class="box pl">${P.projects.map(p=>`<li><b>${p.url?`<a href="${p.url}" target="_blank" rel="noopener">${p.name} ↗</a>`:p.name}</b><span>${p.desc}</span><span class="mono">${p.tag}</span></li>`).join("")}</ul>
<p class="mono" style="margin-top:16px;text-transform:none">${P.ndaNote}</p></section>

<section><div class="sh"><h2 class="big">What I<br>build</h2></div><div class="svc">${P.services.map((s,i)=>`<div class="box"><span class="n">${pad(i+1)}</span><h3>${s.title}</h3><p>${s.desc}</p></div>`).join("")}</div></section>

<section id="xp"><div class="sh"><h2 class="big">Experience</h2><p class="mono">${P.education.degree} · ${P.education.detail}</p></div>
<div class="xp">${P.experience.map(e=>`<div class="box"><div><p class="mono">${e.when}</p><p class="mono" style="opacity:.6;margin-top:4px">${e.place}</p></div><div><h3>${e.role} <span style="font-weight:500;opacity:.65">@ ${e.org}</span></h3><ul>${e.points.map(p=>`<li>${p}</li>`).join("")}</ul>${e.stack?`<div class="tags" style="margin-top:14px">${e.stack.split(" · ").map(s=>`<span>${s}</span>`).join("")}</div>`:""}</div></div>`).join("")}</div></section>

<section><div class="sh"><h2 class="big">Toolkit</h2></div><div class="svc">${P.skills.map(s=>`<div class="box"><span class="mono">${s.group}</span><div class="tags" style="margin-top:14px">${s.items.map(i=>`<span>${i}</span>`).join("")}</div></div>`).join("")}</div></section>

<section id="contact"><div class="ct"><p class="mono" style="color:var(--y)">Got a problem that needs AI?</p><h2 class="big" style="margin-top:12px">Let's<br>talk.</h2>
<a class="btn" href="mailto:${P.email}?subject=Project%20enquiry">${P.email} →</a>
<div class="lk mono"><a href="${P.links.linkedin}" target="_blank" rel="noopener">LinkedIn ↗</a><a href="${P.links.github}" target="_blank" rel="noopener">GitHub ↗</a><a href="${P.links.resume}" target="_blank" rel="noopener">Résumé ↗</a></div></div></section>
<p class="mono" style="padding:32px 0;text-align:center">© ${new Date().getFullYear()} ${P.name} — made loud in ${P.location}</p></div>`;
})();
</script>
<script src="/assets/switcher.js" defer></script>
</body>
</html>
