<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kuldeep Dangi — Brutal</title>
<meta name="description" content="Kuldeep Dangi — Software Engineer building voice AI, LLM systems and full-stack products." />
<meta property="og:title" content="Kuldeep Dangi — AI &amp; Software Engineer" /><meta property="og:image" content="https://ikuldeepdangi.github.io/assets/img/og-card.png" /><meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="/assets/img/favicon/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#fff6d6;--ink:#111;--y:#ffd400;--p:#ff5ea8;--b:#3d7bff;--g:#20c46b;--o:#ff7a1a;--sh:6px 6px 0 var(--ink)}
*{box-sizing:border-box}html{scroll-behavior:smooth;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.5 "Space Grotesk",system-ui,sans-serif;padding-bottom:96px;overflow-x:clip;background-image:radial-gradient(#11111122 1.2px,transparent 1.2px);background-size:22px 22px}
h1,h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}a{color:inherit}
::selection{background:var(--p);color:var(--ink)}
.w{max-width:1220px;margin:0 auto;padding:0 clamp(16px,3vw,32px)}
.box{background:#fff;border:3px solid var(--ink);box-shadow:var(--sh);border-radius:16px}
.mono{font:700 13px/1.3 "Space Mono",monospace;text-transform:uppercase}
.big{font-family:"Archivo Black",sans-serif;font-weight:400;letter-spacing:-.02em;line-height:.92;text-transform:uppercase}
nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding:10px 12px 10px 18px;position:sticky;top:12px;z-index:30}
nav .l{display:flex;gap:8px;flex-wrap:wrap}nav .l a{text-decoration:none;padding:6px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--bg);transition:transform .15s,background .15s}nav .l a:hover{background:var(--y);transform:rotate(-3deg)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:15px 22px;border:3px solid var(--ink);box-shadow:var(--sh);border-radius:12px;font:700 17px/1 "Space Grotesk";text-decoration:none;transition:transform .12s,box-shadow .12s;background:var(--y);cursor:pointer;color:var(--ink)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:8px 8px 0 var(--ink)}.btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.hero{position:relative;margin-top:44px;padding:clamp(24px,5vw,60px);min-height:620px}
.hero h1{font-size:clamp(50px,9.6vw,150px);position:relative;z-index:2}
.hl{background:var(--p);padding:0 .12em;border:3px solid var(--ink);display:inline-block;transform:rotate(-2deg);margin:6px 0;box-shadow:4px 4px 0 var(--ink)}
.hl2{background:var(--b);color:#fff;padding:0 .12em;border:3px solid var(--ink);display:inline-block;transform:rotate(1.5deg);box-shadow:4px 4px 0 var(--ink)}
.hero p.ld{max-width:58ch;font-size:19px;margin-top:30px;position:relative;z-index:2}
.badge{position:absolute;right:clamp(12px,4vw,48px);top:-40px;width:140px;height:140px;animation:rot 14s linear infinite;z-index:3}
.badge text{font:700 12.5px "Space Mono";letter-spacing:2px}@keyframes rot{to{transform:rotate(360deg)}}
.stk{display:inline-block;padding:6px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--g);color:#fff;margin-bottom:22px}
.sticker{position:absolute;z-index:4;padding:10px 16px;border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);font:700 15px "Space Mono";text-transform:uppercase;cursor:grab;user-select:none;touch-action:none;transition:box-shadow .15s}
.sticker:active{cursor:grabbing;box-shadow:8px 8px 0 var(--ink)}
.drag-hint{position:absolute;right:28px;bottom:22px;z-index:2;opacity:.7}
.bands{position:relative;height:190px;margin:70px 0 10px;overflow:hidden}
.band{position:absolute;left:-5%;width:110%;border-block:3px solid var(--ink);white-space:nowrap;overflow:hidden;padding:12px 0}
.band div{display:inline-flex;gap:28px;font:400 32px/1 "Archivo Black";text-transform:uppercase;animation:mq 30s linear infinite}
.band.a{top:40px;background:var(--y);transform:rotate(-3deg)}.band.b{top:80px;background:var(--ink);color:var(--bg);transform:rotate(2.5deg)}.band.b div{animation-direction:reverse}
.band span::after{content:"✦";margin-left:28px}
@keyframes mq{to{transform:translateX(-50%)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.stats .box{padding:24px;transition:transform .2s}.stats .box:hover{transform:rotate(-2deg) translateY(-4px)}.stats b{font:400 clamp(40px,5vw,68px)/1 "Archivo Black"}
.stats .box:nth-child(1){background:var(--y)}.stats .box:nth-child(2){background:var(--b);color:#fff}.stats .box:nth-child(3){background:var(--p)}.stats .box:nth-child(4){background:var(--g);color:#fff}
section{margin-top:120px}.sh{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:32px;flex-wrap:wrap}.sh h2{font-size:clamp(46px,7.4vw,104px)}
.case{display:grid;grid-template-columns:1fr 1.15fr;gap:28px;padding:28px;margin-bottom:36px;align-items:center}
.case:nth-child(even){grid-template-columns:1.15fr 1fr}.case:nth-child(even) .txt{order:2}
.case:nth-child(4n+1){background:#fff}.case:nth-child(4n+2){background:#e9f0ff}.case:nth-child(4n+3){background:#ffe7f2}.case:nth-child(4n+4){background:#e3f8ec}
.case h3{font:400 clamp(38px,4.4vw,60px)/1 "Archivo Black";text-transform:uppercase;margin:14px 0 10px}
.case .k{display:inline-block;padding:4px 10px;border:2px solid var(--ink);border-radius:8px;background:var(--y)}
.case p+p{margin-top:10px}
.case .imp{margin-top:16px;padding:12px 14px;border:3px solid var(--ink);border-radius:12px;font-weight:700;background:var(--y);box-shadow:4px 4px 0 var(--ink);display:inline-block}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.tags span{font:700 12px "Space Mono";padding:4px 8px;border:2px solid var(--ink);border-radius:6px;background:var(--bg)}
.win{border:3px solid var(--ink);border-radius:16px;box-shadow:8px 8px 0 var(--ink);overflow:hidden;background:#fff;transform:rotate(1deg);transition:transform .3s}
.case:nth-child(even) .win{transform:rotate(-1deg)}.case:hover .win{transform:rotate(0) scale(1.015)}
.win{--mk-bg:#fff;--mk-card:#fff6d6;--mk-fg:#111;--mk-mut:#555;--mk-ac:#ff5ea8;--mk-ac2:#3d7bff;--mk-ln:rgba(17,17,17,.18);--mk-r:10px;--mk-on:#111;--mk-font:"Space Grotesk",sans-serif;--mk-mono:"Space Mono",monospace}
.case:nth-child(4n+2) .win{--mk-ac:#3d7bff;--mk-on:#fff}.case:nth-child(4n+3) .win{--mk-ac:#ff7a1a}.case:nth-child(4n+4) .win{--mk-ac:#20c46b;--mk-on:#fff}
.win .mk{border:0;border-radius:0}
.pl{padding:8px 24px}.pl li{display:grid;grid-template-columns:1fr 2fr auto;gap:16px;padding:14px 0;border-bottom:2px solid var(--ink);transition:transform .15s}.pl li:last-child{border:0}.pl li:hover{transform:translateX(8px)}
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.svc .box{padding:24px;transition:transform .2s}.svc .box:hover{transform:translateY(-6px) rotate(1deg)}.svc h3{font:400 24px/1.05 "Archivo Black";text-transform:uppercase;margin:14px 0 10px}
.n{display:inline-grid;place-items:center;width:44px;height:44px;border:2px solid var(--ink);border-radius:50%;font:700 14px "Space Mono"}
.svc .box:nth-child(4n+1) .n{background:var(--p)}.svc .box:nth-child(4n+2) .n{background:var(--b);color:#fff}.svc .box:nth-child(4n+3) .n{background:var(--g);color:#fff}.svc .box:nth-child(4n+4) .n{background:var(--y)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:s}
.steps .box{padding:24px;position:relative}.steps .box:not(:last-child)::after{content:"→";position:absolute;right:-22px;top:50%;transform:translateY(-50%);font:400 26px "Archivo Black";z-index:2}
.steps h3{font:400 30px/1 "Archivo Black";text-transform:uppercase;margin:10px 0 8px}
.xp{display:grid;gap:18px}.xp .box{padding:24px 28px;display:grid;grid-template-columns:220px 1fr;gap:20px}.xp h3{font-size:24px;font-weight:700}
.xp ul{margin-top:10px;display:grid;gap:6px}.xp ul li{padding-left:22px;position:relative}.xp ul li::before{content:"✦";position:absolute;left:0;color:var(--p)}
.ct{background:var(--ink);color:var(--bg);padding:clamp(28px,6vw,76px);border-radius:20px;box-shadow:12px 12px 0 var(--p);position:relative;overflow:hidden}
.ct h2{font-size:clamp(56px,10vw,150px)}.ct .row{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}.ct .btn{font-size:clamp(14px,2.2vw,22px);word-break:break-all}
.ct .lk{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.ct .lk a{padding:8px 14px;border:2px solid var(--bg);border-radius:999px;text-decoration:none}.ct .lk a:hover{background:var(--bg);color:var(--ink)}
.conf{position:fixed;z-index:200;pointer-events:none;font-size:22px;will-change:transform}
.rv{opacity:0;transform:translateY(30px) rotate(-1deg);transition:opacity .6s,transform .6s cubic-bezier(.3,1.4,.5,1)}.rv.in{opacity:1;transform:none}
@media(max-width:900px){.stats,.svc,.steps{grid-template-columns:1fr 1fr}.steps .box::after{display:none}.case,.case:nth-child(even){grid-template-columns:1fr;padding:20px}.case:nth-child(even) .txt{order:0}.xp .box{grid-template-columns:1fr;gap:6px}.pl li{grid-template-columns:1fr;gap:4px}nav .l{display:none}.badge{width:100px;height:100px;top:-30px}.hero{min-height:0;padding-bottom:110px}}
@media(max-width:700px){.sticker{position:relative;left:auto!important;top:auto!important;display:inline-block;margin:26px 8px 0 0;pointer-events:none}}
@media(max-width:520px){.stats,.svc,.steps{grid-template-columns:1fr}.win .mk{aspect-ratio:auto;min-height:330px}.drag-hint{display:none}}
@media(prefers-reduced-motion:reduce){.badge,.band div{animation:none}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="/assets/data.js"></script>
<script src="/assets/mocks.js"></script>
<script>
(function(){
const P=window.PROFILE,pad=n=>String(n).padStart(2,"0"),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const sk=P.skills.flatMap(s=>s.items),sk2=P.services.map(s=>s.title);
const stickers=[["Whisper","--y","8%","72%",-8],["OpenAI","--g","70%","64%",6],["Ships fast ⚡","--p","40%","80%",-4],["FastAPI","--b","82%","34%",10],["React","--o","58%","8%",-6]];
document.getElementById("app").innerHTML=`<div class="w">
<nav class="box"><strong class="big" style="font-size:20px">KD.</strong><div class="l mono"><a href="#work">Work</a><a href="#how">Process</a><a href="#xp">Experience</a><a href="${P.links.resume}" target="_blank" rel="noopener">Résumé</a><a href="#contact" style="background:var(--p)">Contact</a></div></nav>
<header class="box hero" id="hero">
<svg class="badge" viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="68" fill="#ffd400" stroke="#111" stroke-width="3"/><path id="cp" d="M70,70 m-50,0 a50,50 0 1,1 100,0 a50,50 0 1,1 -100,0" fill="none"/><text><textPath href="#cp">AVAILABLE FOR WORK ✦ AVAILABLE FOR WORK ✦</textPath></text><text x="70" y="78" text-anchor="middle" style="font:400 22px 'Archivo Black'">AI</text></svg>
<span class="stk mono">● ${P.role} · ${P.location}</span>
<h1 class="big">I build AI<br>that <span class="hl">listens,</span><br><span class="hl2">reads</span> &amp; talks back.</h1>
<p class="ld">${P.intro}</p>
<div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:34px;position:relative;z-index:2"><a class="btn" href="#contact">Start a project →</a><a class="btn" style="background:#fff" href="#work">See the work</a></div>
${stickers.map(s=>`<span class="sticker" style="background:var(${s[1]});left:${s[2]};top:${s[3]};transform:rotate(${s[4]}deg);${s[1]==="--b"||s[1]==="--g"?"color:#fff;":""}" aria-hidden="true">${s[0]}</span>`).join("")}
<span class="drag-hint mono" aria-hidden="true">↖ drag the stickers</span>
</header></div>
<div class="bands" aria-hidden="true"><div class="band a"><div>${sk.concat(sk).map(s=>`<span>${s}</span>`).join("")}</div></div><div class="band b"><div>${sk2.concat(sk2,sk2,sk2).map(s=>`<span>${s}</span>`).join("")}</div></div></div>
<div class="w">
<div class="stats">${P.stats.map(s=>`<div class="box rv"><b class="cnt" data-v="${s.value}">${s.value}</b><p class="mono" style="margin-top:8px">${s.label}</p></div>`).join("")}</div>

<section id="work"><div class="sh"><h2 class="big">Selected<br>work</h2><p class="mono">${P.cases.length} case studies ↓</p></div>
${P.cases.map((c,i)=>`<article class="box case rv"><div class="txt"><span class="k mono">Case ${pad(i+1)} · ${c.kind}</span><h3>${c.name}</h3><p><b>${c.tagline}.</b> ${c.problem}</p><p>${c.approach}</p><p class="imp">⚡ ${c.impact}</p><div class="tags">${c.stack.map(s=>`<span>${s}</span>`).join("")}</div></div><div class="win">${MOCKS.render(i)}</div></article>`).join("")}
<ul class="box pl rv">${P.projects.map(p=>`<li><b>${p.url?`<a href="${p.url}" target="_blank" rel="noopener">${p.name} ↗</a>`:p.name}</b><span>${p.desc}</span><span class="mono">${p.tag}</span></li>`).join("")}</ul>
<p class="mono" style="margin-top:16px;text-transform:none">${P.ndaNote}</p></section>

<section><div class="sh"><h2 class="big">What I<br>build</h2></div><div class="svc">${P.services.map((s,i)=>`<div class="box rv"><span class="n">${pad(i+1)}</span><h3>${s.title}</h3><p>${s.desc}</p></div>`).join("")}</div></section>

<section id="how"><div class="sh"><h2 class="big">How I<br>work</h2><p class="mono">Call → prototype → ship → improve</p></div><div class="steps">${P.process.map((s,i)=>`<div class="box rv" style="background:var(${["--y","--p","--b","--g"][i]});${i>1?"color:#fff":""}"><span class="mono">Step ${i+1}</span><h3>${s.step}</h3><p>${s.desc}</p></div>`).join("")}</div></section>

<section id="xp"><div class="sh"><h2 class="big">Experience</h2><p class="mono">${P.education.degree} · ${P.education.detail}</p></div>
<div class="xp">${P.experience.map(e=>`<div class="box rv"><div><p class="mono">${e.when}</p><p class="mono" style="opacity:.6;margin-top:4px">${e.place}</p></div><div><h3>${e.role} <span style="font-weight:500;opacity:.65">@ ${e.org}</span></h3><ul>${e.points.map(p=>`<li>${p}</li>`).join("")}</ul>${e.stack?`<div class="tags" style="margin-top:14px">${e.stack.split(" · ").map(s=>`<span>${s}</span>`).join("")}</div>`:""}</div></div>`).join("")}</div></section>

<section><div class="sh"><h2 class="big">Toolkit</h2></div><div class="svc">${P.skills.map(s=>`<div class="box rv"><span class="mono">${s.group}</span><div class="tags" style="margin-top:14px">${s.items.map(i=>`<span>${i}</span>`).join("")}</div></div>`).join("")}</div></section>

<section id="contact"><div class="ct"><p class="mono" style="color:var(--y)">Got a problem that needs AI?</p><h2 class="big" style="margin-top:12px">Let's<br>talk.</h2>
<div class="row"><a class="btn" href="mailto:${P.email}?subject=Project%20enquiry">${P.email} →</a><button class="btn" type="button" id="cp" style="background:var(--p)">Copy email ✂</button></div>
<div class="lk mono"><a href="${P.links.linkedin}" target="_blank" rel="noopener">LinkedIn ↗</a><a href="${P.links.github}" target="_blank" rel="noopener">GitHub ↗</a><a href="${P.links.resume}" target="_blank" rel="noopener">Résumé ↗</a></div></div></section>
<p class="mono" style="padding:32px 0;text-align:center">© ${new Date().getFullYear()} ${P.name} — made loud in ${P.location}</p></div>`;

const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{rootMargin:"0px 0px -8% 0px"});$$(".rv").forEach(el=>io.observe(el));
MOCKS.observe();
// counters
const cio=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;cio.unobserve(e.target);const el=e.target,raw=el.dataset.v,m=raw.match(/[\d.,]+/);if(!m||still)return;const n=parseFloat(m[0].replace(/,/g,"")),d=(m[0].split(".")[1]||"").length,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1100),v=n*(1-Math.pow(1-k,3));el.textContent=raw.replace(m[0],d?v.toFixed(d):Math.round(v).toLocaleString("en-US"));if(k<1)requestAnimationFrame(f);})(t0);}),{threshold:.6});$$(".cnt").forEach(el=>cio.observe(el));
// draggable stickers (kept inside the hero)
const hero=$("#hero");
$$(".sticker").forEach(s=>{if(getComputedStyle(s).position!=="absolute")return;let sx,sy,ox,oy,on=false,rot=s.style.transform;
 s.addEventListener("pointerdown",e=>{on=true;s.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=s.offsetLeft;oy=s.offsetTop;s.style.zIndex=10;s.style.transform=rot+" scale(1.08)";});
 s.addEventListener("pointermove",e=>{if(!on)return;const H=hero.getBoundingClientRect();let x=ox+e.clientX-sx,y=oy+e.clientY-sy;x=Math.max(0,Math.min(H.width-s.offsetWidth,x));y=Math.max(0,Math.min(H.height-s.offsetHeight,y));s.style.left=x+"px";s.style.top=y+"px";});
 const up=()=>{if(!on)return;on=false;s.style.transform=rot;s.style.zIndex=4;};s.addEventListener("pointerup",up);s.addEventListener("pointercancel",up);});
// copy email + confetti
$("#cp").addEventListener("click",e=>{const b=e.currentTarget;const ok=()=>{b.textContent="Copied! ✓";setTimeout(()=>b.textContent="Copy email ✂",1800);if(still)return;const r=b.getBoundingClientRect(),em=["✦","★","⚡","●","◆"],col=["#ffd400","#ff5ea8","#3d7bff","#20c46b","#ff7a1a"];
 for(let i=0;i<28;i++){const c=document.createElement("span");c.className="conf";c.textContent=em[i%5];c.style.color=col[i%5];c.style.left=r.left+r.width/2+"px";c.style.top=r.top+"px";document.body.appendChild(c);
  const a=Math.random()*Math.PI*2,v=120+Math.random()*180;c.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${Math.cos(a)*v}px,${Math.sin(a)*v-120}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:900+Math.random()*500,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish=()=>c.remove();}};
 (navigator.clipboard?navigator.clipboard.writeText(P.email):Promise.reject()).then(ok,()=>location.href="mailto:"+P.email);});
})();
</script>
<script src="/assets/switcher.js" defer></script>
</body>
</html>
