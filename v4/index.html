<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="robots" content="noindex" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kuldeep Dangi — v4 Bento</title>
<meta name="description" content="Kuldeep Dangi — Software Engineer building voice AI, LLM systems and full-stack products." />
<link rel="icon" href="/assets/img/favicon/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{--bg:#000;--card:#0b0b0d;--line:rgba(255,255,255,.09);--fg:#f2f2f3;--mut:#8a8a93;--a1:#8b7bff;--a2:#38d6ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:90px;overflow-x:hidden}
h1,h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}a{color:inherit;text-decoration:none}
.w{max-width:1200px;margin:0 auto;padding:0 clamp(16px,3vw,32px)}
.mono{font:500 11.5px/1.4 "JetBrains Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0}
nav .lg{display:flex;gap:10px;align-items:center;font-weight:600}nav .lg i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--a1),var(--a2));display:block}
nav .r{display:flex;gap:6px}nav .r a{padding:8px 14px;border-radius:999px;color:var(--mut);font-size:14px}nav .r a:hover{color:var(--fg);background:#111}
.grad{background:linear-gradient(120deg,#fff 20%,#c9c2ff 50%,#8fe7ff 80%);-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:12px}
.c{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px;overflow:hidden;isolation:isolate}
.c::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(420px circle at var(--x,50%) var(--y,0%),rgba(139,123,255,.16),transparent 60%);opacity:0;transition:opacity .3s}
.c:hover::before{opacity:1}
.c::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:radial-gradient(300px circle at var(--x,50%) var(--y,0%),rgba(160,150,255,.55),transparent 60%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s;pointer-events:none}
.c:hover::after{opacity:1}
.g4{grid-template-columns:repeat(4,1fr)}.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.r2{grid-row:span 2}
.hero h1{font-weight:700;font-size:clamp(40px,5.6vw,76px);line-height:1;letter-spacing:-.045em;margin:18px 0 18px}
.hero p{color:var(--mut);max-width:58ch;font-size:17px}
.btns{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.b{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;transition:transform .15s,box-shadow .2s}
.b1{background:#fff;color:#000}.b1:hover{box-shadow:0 0 0 4px rgba(255,255,255,.15)}.b2{border:1px solid var(--line);background:#111}.b2:hover{background:#1a1a1e}.b:hover{transform:translateY(-1px)}
.av{display:flex;flex-direction:column;justify-content:space-between}
.pulse{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:#9ef0b1}.pulse i{width:8px;height:8px;border-radius:50%;background:#3ee07a;box-shadow:0 0 0 0 rgba(62,224,122,.6);animation:p 2s infinite}@keyframes p{70%{box-shadow:0 0 0 10px rgba(62,224,122,0)}}
.clock{font:600 44px/1 Inter;letter-spacing:-.04em;margin-top:14px}
.stat b{display:block;font-size:clamp(36px,4vw,52px);font-weight:700;letter-spacing:-.05em;line-height:1;margin-bottom:8px}
.case h3{font-size:26px;font-weight:700;letter-spacing:-.03em;margin:14px 0 6px}.case p{color:var(--mut);font-size:15px}.case .imp{color:#d6d0ff;font-weight:600;margin-top:16px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}.chips span{font:500 12px/1 "JetBrains Mono";color:#c6c6cf;background:#141418;border:1px solid var(--line);padding:6px 9px;border-radius:8px}
.viz{height:84px;margin-top:18px;display:flex;align-items:center;gap:3px}.viz i{flex:1;height:100%;border-radius:3px;transform-origin:center;background:linear-gradient(var(--a2),var(--a1));animation:v 1.2s ease-in-out infinite alternate}
@keyframes v{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.sec{margin-top:96px}.sec>h2{font-size:clamp(32px,4vw,52px);font-weight:700;letter-spacing:-.04em;margin:10px 0 24px}
.pl li{display:grid;grid-template-columns:1fr 2fr auto;gap:16px;padding:14px 0;border-top:1px solid var(--line)}.pl li span:nth-child(2){color:var(--mut)}
.xp li{padding:18px 0;border-top:1px solid var(--line)}.xp li:first-child{border:0;padding-top:4px}.xp h3{font-size:18px;font-weight:600}.xp h3 span{color:var(--mut);font-weight:400}.xp p{color:var(--mut);font-size:15px;margin-top:6px}
.marq{overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);margin-top:14px}
.marq div{display:flex;gap:8px;width:max-content;animation:mq 35s linear infinite}.marq div span{font:500 13px/1 "JetBrains Mono";padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#0f0f12;white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
.cta{text-align:center;padding:64px 26px}.cta h2{font-size:clamp(36px,6vw,80px);font-weight:700;letter-spacing:-.05em;line-height:1}.cta p{color:var(--mut);margin:16px 0 28px}
footer{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;padding:32px 0;flex-wrap:wrap;gap:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.s2,.s3,.s4,.s6{grid-column:span 2}.g4{grid-template-columns:1fr 1fr}.r2{grid-row:auto}nav .r{display:none}.pl li{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="/assets/data.js"></script>
<script>
(function(){
const P=window.PROFILE;
const bars=Array.from({length:42},(_,i)=>`<i style="animation-delay:${(i*0.07)%1.2}s;animation-duration:${0.8+((i*37)%7)/10}s"></i>`).join("");
const sk=P.skills.flatMap(s=>s.items);
document.getElementById("app").innerHTML=`<div class="w">
<nav><a class="lg" href="#"><i></i>${P.name}</a><div class="r"><a href="#work">Work</a><a href="#xp">Experience</a><a href="${P.links.resume}" target="_blank" rel="noopener">Résumé</a><a href="#contact">Contact</a></div></nav>
<div class="grid">
 <div class="c s4 r2 hero"><span class="mono">${P.role} · ${P.focus}</span><h1 class="grad">${P.headline.join(" ")}</h1><p>${P.intro}</p>
  <div class="btns"><a class="b b1" href="mailto:${P.email}?subject=Project%20enquiry">Start a project →</a><a class="b b2" href="#work">View work</a></div></div>
 <div class="c s2 av"><span class="pulse"><i></i>Available</span><div><div class="clock" id="clk">--:--</div><p class="mono" style="margin-top:8px">${P.location} · ${P.timezone}</p></div></div>
 <div class="c s2"><span class="mono">Live voice pipeline</span><div class="viz" aria-hidden="true">${bars}</div><p style="color:var(--mut);font-size:14px;margin-top:12px">Audio → Whisper → LLM → agent, in real time.</p></div>
</div>
<div class="grid g4" style="margin-top:14px">${P.stats.map(s=>`<div class="c stat"><b class="grad">${s.value}</b><span class="mono">${s.label}</span></div>`).join("")}</div>
<div class="c s6" style="margin-top:14px;padding:18px 0"><div class="marq"><div>${sk.concat(sk).map(s=>`<span>${s}</span>`).join("")}</div></div></div>

<section class="sec" id="work"><span class="mono">Selected work</span><h2>Systems in production</h2>
<div class="grid">${P.cases.map((c,i)=>`<article class="c s3 case"><span class="mono">${c.kind}</span><h3>${c.name}</h3><p style="color:#d3d3d8">${c.tagline}.</p><p style="margin-top:10px">${c.approach}</p><p class="imp">↗ ${c.impact}</p><div class="chips">${c.stack.map(s=>`<span>${s}</span>`).join("")}</div></article>`).join("")}</div>
<div class="c" style="margin-top:14px"><span class="mono">More projects</span><ul class="pl" style="margin-top:12px">${P.projects.map(p=>`<li><span style="font-weight:600">${p.url?`<a href="${p.url}" target="_blank" rel="noopener">${p.name} ↗</a>`:p.name}</span><span>${p.desc}</span><span class="mono">${p.tag}</span></li>`).join("")}</ul><p class="mono" style="margin-top:14px;text-transform:none;letter-spacing:0">${P.ndaNote}</p></div></section>

<section class="sec"><span class="mono">Services</span><h2>What I can build for you</h2>
<div class="grid">${P.services.map(s=>`<div class="c s3"><h3 style="font-size:20px;font-weight:600;letter-spacing:-.02em">${s.title}</h3><p style="color:var(--mut);margin-top:8px">${s.desc}</p></div>`).join("")}</div></section>

<section class="sec" id="xp"><span class="mono">Experience</span><h2>Where I've shipped</h2>
<div class="grid"><div class="c s4"><ul class="xp">${P.experience.map(e=>`<li><span class="mono">${e.when}</span><h3 style="margin-top:6px">${e.role} <span>· ${e.org}</span></h3><p>${e.points[0]}</p>${e.points.slice(1).map(p=>`<p>${p}</p>`).join("")}</li>`).join("")}</ul></div>
<div class="c s2"><span class="mono">Education</span><h3 style="font-size:20px;margin-top:12px;letter-spacing:-.02em">${P.education.degree}</h3><p style="color:var(--mut);margin-top:6px">${P.education.school}<br>${P.education.detail} · ${P.education.year}</p>
<span class="mono" style="display:block;margin-top:28px">Credentials</span><ul style="margin-top:10px">${P.credentials.map(c=>`<li style="color:var(--mut);font-size:14px;padding:8px 0;border-top:1px solid var(--line)">${c}</li>`).join("")}</ul></div></div></section>

<section class="sec" id="contact"><div class="c cta"><span class="mono">Contact</span><h2 class="grad" style="margin-top:14px">Let's ship something real.</h2><p>${P.available}. I usually reply within a day.</p>
<div class="btns" style="justify-content:center"><a class="b b1" href="mailto:${P.email}?subject=Project%20enquiry">${P.email}</a><a class="b b2" href="${P.links.linkedin}" target="_blank" rel="noopener">LinkedIn ↗</a><a class="b b2" href="${P.links.github}" target="_blank" rel="noopener">GitHub ↗</a></div></div></section>
<footer><span>© ${new Date().getFullYear()} ${P.name}</span><span>${P.location}</span></footer></div>`;
document.querySelectorAll(".c").forEach(c=>c.addEventListener("pointermove",e=>{const r=c.getBoundingClientRect();c.style.setProperty("--x",e.clientX-r.left+"px");c.style.setProperty("--y",e.clientY-r.top+"px");}));
const clk=document.getElementById("clk"),tick=()=>{clk.textContent=new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Kolkata"});};tick();setInterval(tick,15000);
})();
</script>
<script src="/assets/switcher.js" defer></script>
</body>
</html>
