<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="robots" content="noindex" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kuldeep Dangi — v9 Signal</title>
<meta name="description" content="Kuldeep Dangi — Software Engineer building voice AI, LLM systems and full-stack products." />
<link rel="icon" href="/assets/img/favicon/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
:root{--bg:#04050a;--fg:#e9ecf5;--mut:#8890a8;--c:#5ef2ff;--v:#9b7bff;--line:rgba(140,160,255,.14);--card:rgba(14,17,30,.6)}
*{box-sizing:border-box}html{scroll-behavior:smooth;overflow-x:clip}body{margin:0;background:var(--bg);color:var(--fg);font:400 16.5px/1.6 "Space Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:96px;overflow-x:hidden}
h1,h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}a{color:inherit;text-decoration:none}
.w{max-width:1240px;margin:0 auto;padding:0 clamp(16px,3vw,36px)}
.mono{font:400 12px/1.4 "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.grid-bg{position:fixed;inset:0;z-index:-2;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:64px 64px;-webkit-mask:radial-gradient(ellipse 70% 60% at 50% 30%,#000,transparent);mask:radial-gradient(ellipse 70% 60% at 50% 30%,#000,transparent);opacity:.5}
nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0;position:relative;z-index:3}
nav .l{display:flex;gap:28px}nav .l a{color:var(--mut);font-size:14px}nav .l a:hover{color:var(--fg)}
.lg{display:flex;align-items:center;gap:10px;font-weight:600}.lg i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 14px var(--c)}
.hero{position:relative;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;min-height:min(88vh,860px);gap:20px}
.hero h1{font-weight:500;font-size:clamp(42px,6.4vw,96px);line-height:.98;letter-spacing:-.045em;margin:22px 0 24px}
.hero h1 .g{background:linear-gradient(90deg,var(--c),var(--v));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);max-width:52ch;font-size:17.5px}
.stage{position:relative;aspect-ratio:1;width:100%;max-width:640px;justify-self:center}
#orb{position:absolute;inset:-10%;width:120%;height:120%;cursor:pointer}
.stage .lbl{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);white-space:nowrap}
.btns{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap}
.b{position:relative;display:inline-flex;align-items:center;gap:10px;padding:15px 24px;border-radius:14px;font-weight:500;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.b1{background:linear-gradient(135deg,var(--c),var(--v));color:#050611;box-shadow:0 10px 40px rgba(94,242,255,.25)}.b1:hover{box-shadow:0 14px 50px rgba(155,123,255,.45)}
.b2{border:1px solid var(--line);background:rgba(255,255,255,.03)}.b2:hover{border-color:rgba(94,242,255,.5)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.sp{position:relative;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;overflow:hidden;isolation:isolate;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sp::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(380px circle at var(--x,-100px) var(--y,-100px),rgba(94,242,255,.12),transparent 60%)}
.sp::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:radial-gradient(260px circle at var(--x,-100px) var(--y,-100px),rgba(94,242,255,.7),rgba(155,123,255,.4) 40%,transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.stats b{display:block;font-size:clamp(36px,4vw,54px);font-weight:500;letter-spacing:-.05em;line-height:1;margin-bottom:10px}
section{padding-top:clamp(110px,12vw,170px)}.sh{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:36px;flex-wrap:wrap}.sh h2{font-size:clamp(34px,5vw,64px);font-weight:500;letter-spacing:-.04em;line-height:1;margin-top:12px}
.cases{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.case{padding:32px;display:flex;flex-direction:column;gap:10px;min-height:360px}
.case h3{font-size:34px;font-weight:500;letter-spacing:-.04em;margin-top:8px}
.case .pa{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;margin-top:8px;font-size:15px}.case .pa dt{font:400 11px/1.9 "JetBrains Mono";text-transform:uppercase;letter-spacing:.08em;color:var(--c)}.case .pa dd{margin:0;color:var(--mut)}
.case .imp{margin-top:auto;padding-top:18px;border-top:1px solid var(--line);font-weight:500}
.case .imp span{background:linear-gradient(90deg,var(--c),var(--v));-webkit-background-clip:text;background-clip:text;color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips span{font:400 11.5px "JetBrains Mono";padding:5px 9px;border:1px solid var(--line);border-radius:8px;color:#c2c8dc}
.pl li{display:grid;grid-template-columns:1fr 2fr auto;gap:20px;padding:18px 4px;border-top:1px solid var(--line)}.pl li span:nth-child(2){color:var(--mut)}
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.svc h3{font-size:20px;font-weight:500;margin:16px 0 8px}.svc p{color:var(--mut);font-size:15px}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative;margin-top:16px}
.flow .sp .n{font:400 12px "JetBrains Mono";color:var(--c)}
.xp{display:grid;gap:14px}.xp .sp{display:grid;grid-template-columns:220px 1fr;gap:24px}.xp h3{font-size:22px;font-weight:500;letter-spacing:-.02em}.xp h3 span{color:var(--mut)}
.xp ul{margin-top:10px;display:grid;gap:6px}.xp ul li{position:relative;padding-left:18px;color:var(--mut)}.xp ul li::before{content:"";position:absolute;left:0;top:.7em;width:6px;height:6px;border-radius:2px;background:var(--c)}
.ct{text-align:center;padding:clamp(56px,8vw,110px) 24px}.ct h2{font-size:clamp(40px,7vw,100px);font-weight:500;letter-spacing:-.05em;line-height:1}.ct p{color:var(--mut);margin-top:16px}
.rv{opacity:0;transform:translateY(20px);transition:opacity .8s,transform .8s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
@media(max-width:960px){#orb{inset:0;width:100%;height:100%}.hero{grid-template-columns:1fr;min-height:auto;padding:24px 0}.stage{max-width:420px;order:-1}.cases{grid-template-columns:1fr}.svc,.flow,.stats{grid-template-columns:1fr 1fr}.xp .sp{grid-template-columns:1fr;gap:6px}.pl li{grid-template-columns:1fr;gap:4px}nav .l{display:none}}
@media(max-width:520px){.svc,.flow,.stats{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="grid-bg" aria-hidden="true"></div>
<div id="app"></div>
<script src="/assets/data.js"></script>
<script>
(function(){
const P=window.PROFILE,pad=n=>String(n).padStart(2,"0");
document.getElementById("app").innerHTML=`<div class="w">
<nav><a class="lg" href="#"><i></i>${P.name}</a><div class="l"><a href="#work">Work</a><a href="#process">Process</a><a href="#xp">Experience</a><a href="${P.links.resume}" target="_blank" rel="noopener">Résumé</a></div><a class="b b2 mag" style="padding:10px 16px" href="#contact">Contact</a></nav>
<header class="hero"><div><span class="mono">● ${P.available}</span>
<h1>I build AI that <span class="g">listens, reads</span> and talks back.</h1><p>${P.intro}</p>
<div class="btns"><a class="b b1 mag" href="mailto:${P.email}?subject=Project%20enquiry">Start a project →</a><a class="b b2 mag" href="#work">See the systems</a></div></div>
<div class="stage"><canvas id="orb" aria-label="Interactive voice field — click to make it speak" role="img"></canvas><span class="mono lbl">Click the field · it speaks</span></div></header>
<div class="stats">${P.stats.map(s=>`<div class="sp rv"><b>${s.value}</b><span class="mono">${s.label}</span></div>`).join("")}</div>
<section id="work"><div class="sh rv"><div><span class="mono">01 — Selected work</span><h2>Systems that hold a conversation</h2></div></div>
<div class="cases">${P.cases.map(c=>`<article class="sp case rv"><span class="mono">${c.kind}</span><h3>${c.name}</h3><p>${c.tagline}.</p><dl class="pa"><dt>Problem</dt><dd>${c.problem}</dd><dt>Approach</dt><dd>${c.approach}</dd></dl><p class="imp">Impact · <span>${c.impact}</span></p><div class="chips">${c.stack.map(s=>`<span>${s}</span>`).join("")}</div></article>`).join("")}</div>
<div class="sp rv" style="margin-top:16px;padding:12px 28px"><ul class="pl">${P.projects.map((p,i)=>`<li style="${i?"":"border-top:0"}"><b style="font-weight:500">${p.url?`<a href="${p.url}" target="_blank" rel="noopener">${p.name} ↗</a>`:p.name}</b><span>${p.desc}</span><span class="mono">${p.tag}</span></li>`).join("")}</ul></div>
<p class="mono rv" style="margin-top:16px;text-transform:none;letter-spacing:0">${P.ndaNote}</p></section>
<section><div class="sh rv"><div><span class="mono">02 — Services</span><h2>What I can build for you</h2></div></div><div class="svc">${P.services.map((s,i)=>`<div class="sp rv"><span class="mono" style="color:var(--c)">${pad(i+1)}</span><h3>${s.title}</h3><p>${s.desc}</p></div>`).join("")}</div></section>
<section id="process"><div class="sh rv"><div><span class="mono">03 — Process</span><h2>From first call to production</h2></div></div><div class="flow">${P.process.map((s,i)=>`<div class="sp rv"><span class="n">${pad(i+1)} →</span><h3 style="font-size:22px;font-weight:500;margin:12px 0 8px">${s.step}</h3><p style="color:var(--mut);font-size:15px">${s.desc}</p></div>`).join("")}</div></section>
<section id="xp"><div class="sh rv"><div><span class="mono">04 — Experience</span><h2>Track record</h2></div><span class="mono">${P.education.degree} · ${P.education.detail}</span></div>
<div class="xp">${P.experience.map(e=>`<div class="sp rv"><div><p class="mono" style="color:var(--fg)">${e.when}</p><p class="mono" style="margin-top:4px">${e.place}</p></div><div><h3>${e.role} <span>· ${e.org}</span></h3><ul>${e.points.map(p=>`<li>${p}</li>`).join("")}</ul>${e.stack?`<div class="chips" style="margin-top:12px">${e.stack.split(" · ").map(s=>`<span>${s}</span>`).join("")}</div>`:""}</div></div>`).join("")}</div>
<div class="svc" style="margin-top:16px">${P.skills.map(s=>`<div class="sp rv"><span class="mono" style="color:var(--c)">${s.group}</span><div class="chips" style="margin-top:12px">${s.items.map(i=>`<span>${i}</span>`).join("")}</div></div>`).join("")}</div></section>
<section id="contact"><div class="sp ct rv"><span class="mono">05 — Contact</span><h2 style="margin-top:16px">Let's give your product a voice.</h2><p>I usually reply within a day · ${P.location} · ${P.timezone}</p>
<div class="btns" style="justify-content:center"><a class="b b1 mag" href="mailto:${P.email}?subject=Project%20enquiry">${P.email}</a><a class="b b2 mag" href="${P.links.linkedin}" target="_blank" rel="noopener">LinkedIn ↗</a><a class="b b2 mag" href="${P.links.github}" target="_blank" rel="noopener">GitHub ↗</a></div></div></section>
<p class="mono" style="display:flex;justify-content:space-between;padding:40px 0 24px"><span>© ${new Date().getFullYear()} ${P.name}</span><span>Built by hand · no templates</span></p></div>`;

const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
// Spotlight cards
document.addEventListener("pointermove",e=>{document.querySelectorAll(".sp").forEach(c=>{const r=c.getBoundingClientRect();c.style.setProperty("--x",e.clientX-r.left+"px");c.style.setProperty("--y",e.clientY-r.top+"px");});},{passive:true});
// Magnetic buttons
if(matchMedia("(hover:hover)").matches&&!still)document.querySelectorAll(".mag").forEach(b=>{b.addEventListener("pointermove",e=>{const r=b.getBoundingClientRect();b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.25}px,${(e.clientY-r.top-r.height/2)*.35}px)`;});b.addEventListener("pointerleave",()=>b.style.transform="");});
// Reveal
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{rootMargin:"0px 0px -6% 0px"});document.querySelectorAll(".rv").forEach(el=>io.observe(el));
// Voice field: a sphere of points displaced by a speech-like signal
const cv=document.getElementById("orb"),cx=cv.getContext("2d");let W,H,dpr;
const N=1400,pts=[];for(let i=0;i<N;i++){const y=1-(i/(N-1))*2,r=Math.sqrt(1-y*y),t=i*2.399963;pts.push([Math.cos(t)*r,y,Math.sin(t)*r]);}
function size(){dpr=Math.min(2,devicePixelRatio||1);const b=cv.getBoundingClientRect();W=b.width;H=b.height;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);}
size();addEventListener("resize",size);
let mx=0,my=0,amp=.15,target=.15,talkUntil=0;
cv.addEventListener("pointermove",e=>{const b=cv.getBoundingClientRect();mx=(e.clientX-b.left)/b.width-.5;my=(e.clientY-b.top)/b.height-.5;});
cv.addEventListener("click",()=>{talkUntil=performance.now()+2600;});
function draw(t){t/=1000;const talking=performance.now()<talkUntil;
 target=talking?.55+.35*Math.abs(Math.sin(t*9)*Math.sin(t*3.7)):.12+.05*Math.sin(t*1.3);amp+=(target-amp)*.12;
 cx.clearRect(0,0,W,H);const R=Math.min(W,H)*.33,ox=W/2,oy=H/2,ry=t*.25+mx*1.2,rx=my*.9;
 const cy_=Math.cos(ry),sy=Math.sin(ry),cxr=Math.cos(rx),sxr=Math.sin(rx);
 for(let i=0;i<N;i++){let[x,y,z]=pts[i];
  const n=Math.sin(x*4+t*2)*Math.cos(y*5-t*1.6)*Math.sin(z*3+t*2.4),d=1+n*amp*.5;x*=d;y*=d;z*=d;
  let X=x*cy_-z*sy,Z=x*sy+z*cy_,Y=y*cxr-Z*sxr;Z=y*sxr+Z*cxr;
  const p=1.8/(2.6-Z),px=ox+X*R*p,py=oy+Y*R*p,a=(Z+1.2)/2.2;
  cx.fillStyle=`rgba(${(94+(155-94)*(1-a))|0},${(242+(123-242)*(1-a))|0},255,${.15+a*.75})`;
  const s=(.6+a*1.5)*(1+n*amp);cx.fillRect(px,py,s,s);}
 const g=cx.createRadialGradient(ox,oy,0,ox,oy,R*1.4);g.addColorStop(0,`rgba(94,242,255,${.05+amp*.12})`);g.addColorStop(1,"rgba(0,0,0,0)");cx.fillStyle=g;cx.fillRect(0,0,W,H);
 if(!still)requestAnimationFrame(draw);}
requestAnimationFrame(draw);
})();
</script>
<script src="/assets/switcher.js" defer></script>
</body>
</html>
