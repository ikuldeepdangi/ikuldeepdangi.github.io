.c-impact{background:#f5f5f7}
.c-tile{background:#fff;border:0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.c-list{background:#fff;border:0;border-radius:24px;padding:4px 22px}.c-list li:last-child{border-bottom:0}
.c-xp{background:#fff;border:0;border-radius:24px;padding:4px clamp(18px,3vw,32px)}.c-xp>li:last-child{border-bottom:0}
.c-contact{background:#fff;border:0;text-align:center}.c-contact h2,.c-contact p{margin-inline:auto}.c-contact .c-cta,.c-contact .c-socials{justify-content:center}
.c-chips span{background:#f5f5f7;border-color:transparent}
