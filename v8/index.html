<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kuldeep Dangi — AI &amp; Software Engineer</title>
<meta name="description" content="Kuldeep Dangi is a Software Engineer in Indore building production AI: voice assistants, call-centre copilots, LLM systems and the full-stack products around them." />
<meta property="og:type" content="website" /><meta property="og:url" content="https://ikuldeepdangi.github.io/" />
<meta property="og:title" content="Kuldeep Dangi — AI &amp; Software Engineer" /><meta property="og:description" content="Voice AI, LLM systems and full-stack products, shipped to production." />
<meta property="og:image" content="https://ikuldeepdangi.github.io/assets/img/og-card.png" /><meta name="twitter:card" content="summary_large_image" />
<meta name="theme-color" content="#0d0d0d" />
<link rel="icon" href="/assets/img/favicon/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0d0d0d;--bg2:#141413;--fg:#f1f1ec;--mut:#8b8b85;--ac:#d4ff3a;--line:#262624}
*{box-sizing:border-box}html{scroll-behavior:smooth;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:96px;overflow-x:clip}
h1,h2,h3,p,ul{margin:0}ul{padding:0;list-style:none}a{color:inherit;text-decoration:none}
::selection{background:var(--ac);color:#0d0d0d}
.w{max-width:1400px;margin:0 auto;padding:0 clamp(16px,3vw,40px)}
.u{font-family:Unbounded,sans-serif;letter-spacing:-.03em;text-transform:uppercase}
.mono{font:400 12px/1.4 "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
/* loader */
.ld{position:fixed;inset:0;z-index:10000;background:var(--ac);color:#0d0d0d;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(16px,3vw,40px);transition:transform 1s cubic-bezier(.8,0,.2,1)}
.ld.out{transform:translateY(-100%)}.ld .n{font:800 clamp(80px,22vw,320px)/.8 Unbounded;letter-spacing:-.06em}.ld .t{display:flex;justify-content:space-between;font:600 14px Unbounded;text-transform:uppercase}
.ld .bar{height:3px;background:rgba(0,0,0,.15)}.ld .bar i{display:block;height:100%;width:0;background:#0d0d0d}
/* cursor */
.cur{position:fixed;left:0;top:0;width:14px;height:14px;border-radius:50%;background:var(--ac);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .3s cubic-bezier(.2,.8,.2,1),height .3s cubic-bezier(.2,.8,.2,1),background .2s;display:grid;place-items:center;color:#0d0d0d;font:700 11px Unbounded;letter-spacing:-.02em;text-transform:uppercase;overflow:hidden}
.cur span{opacity:0;transition:opacity .2s}.cur.lbl{width:92px;height:92px}.cur.lbl span{opacity:1}.cur.big{width:56px;height:56px;background:transparent;border:1.5px solid var(--ac)}
@media(hover:none){.cur{display:none}}
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(16px,3vw,40px);mix-blend-mode:difference;color:#fff}
nav .l{display:flex;gap:28px}nav a{font:500 13px Inter;text-transform:uppercase;letter-spacing:.06em}
nav .t{font:400 12px "JetBrains Mono"}
.hero{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:6vh;padding-top:100px}
.hero h1{font-weight:800;font-size:clamp(26px,6.9vw,150px);line-height:.92}
.hero h1 .row{display:block;white-space:nowrap;will-change:transform}
.hero h1 .row .m{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.06em}
.hero h1 .ch{display:inline-block;transform:translateY(110%) rotate(8deg);transition:transform 1.1s cubic-bezier(.2,.9,.1,1)}
.go .hero h1 .ch{transform:none}
.hero h1 .row:nth-child(2){color:var(--ac);padding-left:6vw}
.hero h1 .row:nth-child(3){-webkit-text-stroke:2px var(--fg);color:transparent;padding-left:2vw}
.hero .bt{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:44px;align-items:end;opacity:0;transform:translateY(20px);transition:opacity 1s .9s,transform 1s .9s}
.go .hero .bt{opacity:1;transform:none}
.hero .bt p{max-width:54ch;color:var(--mut);font-size:17px}
.hero .bt .r{display:flex;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:17px 28px;border-radius:999px;font:600 14px Unbounded;text-transform:uppercase;letter-spacing:-.01em;transition:transform .3s cubic-bezier(.2,.8,.2,1),background .2s,color .2s}
.btn1{background:var(--ac);color:#0d0d0d}.btn2{border:1px solid var(--line)}.btn2:hover{background:var(--fg);color:#0d0d0d}
.mq{border-block:1px solid var(--line);overflow:hidden;padding:22px 0;white-space:nowrap}
.mq .t{display:inline-flex;gap:56px;font:600 clamp(28px,4vw,56px)/1 Unbounded;text-transform:uppercase;will-change:transform}
.mq .t span::after{content:"✺";color:var(--ac);margin-left:56px}
.stats{display:grid;grid-template-columns:repeat(4,1fr)}.stats div{padding:48px 24px 48px 0}.stats div+div{padding-left:24px;border-left:1px solid var(--line)}
.stats b{display:block;font:800 clamp(44px,6vw,96px)/1 Unbounded;letter-spacing:-.05em;margin-bottom:10px}
/* reel */
.reel{position:relative;height:calc(var(--n,4) * 110vh)}
.reel .stick{position:sticky;top:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.reel .hd{display:flex;justify-content:space-between;align-items:end;padding:0 clamp(16px,3vw,40px);margin-bottom:28px}
.reel .hd h2{font-size:clamp(40px,6vw,96px);font-weight:800}
.track{display:flex;gap:28px;padding-left:clamp(16px,3vw,40px);will-change:transform}
.card{flex:none;width:min(88vw,1120px);height:min(66vh,620px);border:1px solid var(--line);border-radius:28px;padding:clamp(22px,2.6vw,40px);display:grid;grid-template-columns:1fr 1.15fr;gap:clamp(20px,3vw,44px);align-items:center;background:var(--bg2);position:relative;overflow:hidden;transition:border-color .3s}
.card:hover{border-color:#3a3a37}
.card .bgn{position:absolute;left:-.04em;bottom:-.24em;font:800 clamp(140px,20vw,300px)/1 Unbounded;color:#1b1b19;pointer-events:none}
.card .tx{position:relative;display:flex;flex-direction:column;height:100%}
.card h3{font:800 clamp(34px,4.2vw,68px)/.9 Unbounded;text-transform:uppercase;letter-spacing:-.045em;margin:16px 0 12px}
.card .tg{font-size:19px;color:var(--ac)}.card .ap{color:var(--mut);margin-top:14px;font-size:15.5px}
.card .imp{margin-top:auto;padding-top:22px;font:600 17px Unbounded;text-transform:uppercase;letter-spacing:-.02em}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.card .tags span{font:400 11.5px "JetBrains Mono";padding:5px 9px;border:1px solid var(--line);border-radius:999px}
.card .vz{position:relative;--mk-bg:#0d0d0d;--mk-card:#181816;--mk-fg:#f1f1ec;--mk-mut:#8b8b85;--mk-ac:#d4ff3a;--mk-ac2:#7fe7ff;--mk-ln:#2a2a27;--mk-r:16px;--mk-on:#0d0d0d;--mk-font:Inter,sans-serif;--mk-mono:"JetBrains Mono",monospace}
.card .vz .mk{box-shadow:0 30px 80px rgba(0,0,0,.5)}
.prog{height:2px;background:var(--line);margin:28px clamp(16px,3vw,40px) 0;position:relative}.prog i{display:block;height:100%;width:0;background:var(--ac)}
.prog b{position:absolute;right:0;top:10px;font:400 12px "JetBrains Mono";color:var(--mut);font-weight:400}
/* flat reel for phones / reduced motion */
.reel.flat{height:auto}.reel.flat .stick{position:static;height:auto;padding:120px 0 0}.reel.flat .track{flex-direction:column;transform:none!important;padding-right:clamp(16px,3vw,40px)}
.reel.flat .card{width:100%;height:auto;grid-template-columns:1fr}.reel.flat .prog{display:none}.reel.flat .card .tx{height:auto}
section.s{padding-top:140px}.sh{display:flex;justify-content:space-between;align-items:end;gap:20px;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:8px;flex-wrap:wrap}.sh h2{font-size:clamp(40px,6vw,96px);font-weight:800}
.pl li{display:grid;grid-template-columns:1.2fr 2fr auto;gap:20px;padding:22px 0;border-bottom:1px solid var(--line);transition:color .2s,padding .3s}.pl li:hover{color:var(--ac);padding-left:16px}
.pl li b{font:600 20px Unbounded;letter-spacing:-.02em}.pl li span{color:var(--mut)}
.svc{display:grid;grid-template-columns:repeat(4,1fr)}.svc>div{padding:36px 24px 28px 0;border-bottom:1px solid var(--line)}.svc>div+div{padding-left:24px;border-left:1px solid var(--line)}.svc h3{font:600 22px/1.1 Unbounded;text-transform:uppercase;letter-spacing:-.03em;margin:16px 0 12px}.svc p{color:var(--mut)}
.proc li{display:grid;grid-template-columns:minmax(120px,240px) 1fr 1.2fr;gap:24px;align-items:baseline;padding:30px 0;border-bottom:1px solid var(--line);transition:background .3s}
.proc .n{font:800 clamp(56px,7vw,110px)/.8 Unbounded;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:1.5px var(--mut);transition:color .3s,-webkit-text-stroke-color .3s}
.proc li:hover .n{color:var(--ac);-webkit-text-stroke-color:var(--ac)}.proc h3{font:600 clamp(26px,3vw,40px)/1 Unbounded;text-transform:uppercase;letter-spacing:-.04em}.proc p{color:var(--mut);font-size:17px}
.xp li{display:grid;grid-template-columns:260px 1fr;gap:32px;padding:36px 0;border-bottom:1px solid var(--line)}.xp h3{font:600 26px/1.15 Unbounded;letter-spacing:-.03em}.xp h3 span{color:var(--mut);font-weight:400}
.xp ul{margin-top:14px;display:grid;gap:8px}.xp ul li{display:block;border:0;padding:0 0 0 22px;position:relative;color:var(--mut)}.xp ul li::before{content:"→";position:absolute;left:0;color:var(--ac)}
.ct{padding:clamp(100px,14vw,200px) 0 60px;text-align:center}
.ct h2{font-size:clamp(52px,13vw,240px);font-weight:800;line-height:.85}
.ct h2 .fill{display:block;color:transparent;-webkit-text-stroke:2px var(--fg);background:linear-gradient(var(--ac),var(--ac)) 0 0/0% 100% no-repeat;-webkit-background-clip:text;background-clip:text;transition:background-size .8s cubic-bezier(.7,0,.2,1)}
.ct h2:hover .fill{background-size:100% 100%}
.ct .em{display:inline-block;margin-top:48px;font:600 clamp(16px,2.6vw,36px) Unbounded;letter-spacing:-.03em;border-bottom:2px solid var(--ac);padding-bottom:6px;word-break:break-all;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.rv{opacity:0;transform:translateY(30px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
@media(max-width:900px){nav .l,nav .t{display:none}.hero .bt{grid-template-columns:1fr}.hero .bt .r{justify-content:flex-start}.stats,.svc{grid-template-columns:1fr 1fr}.stats div:nth-child(3),.svc>div:nth-child(3){border-left:0;padding-left:0}.xp li{grid-template-columns:1fr;gap:8px}.pl li{grid-template-columns:1fr;gap:4px}.svc>div{padding-left:0!important;border-left:0!important}.proc li{grid-template-columns:1fr;gap:10px}}
@media(max-width:760px){.hero h1{font-size:12.5vw;line-height:.95}.hero h1 .row{white-space:normal;padding-left:0!important}}
@media(max-width:520px){.stats,.svc{grid-template-columns:1fr}.stats div{border-left:0!important;padding-left:0!important}.card .vz .mk{aspect-ratio:auto;min-height:330px}}
@media(prefers-reduced-motion:reduce){.ld{display:none}.hero h1 .ch,.hero .bt,.rv{transform:none!important;opacity:1!important;transition:none!important}}
</style>
</head>
<body>
<div class="ld" id="ld" aria-hidden="true"><div class="t"><span>Kuldeep Dangi</span><span>Portfolio</span></div><div><div class="n" id="ldn">000</div><div class="bar"><i id="ldb"></i></div></div></div>
<div class="cur" id="cur" aria-hidden="true"><span id="curt"></span></div>
<div id="app"></div>
<script src="/assets/data.js"></script>
<script src="/assets/mocks.js"></script>
<script>
(function(){
const P=window.PROFILE,pad=n=>String(n).padStart(2,"0"),$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],sk=P.skills.flatMap(s=>s.items);
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
$("#ld .t span:last-child").textContent="Portfolio ©"+new Date().getFullYear();
let d=0;const split=(t)=>t.split(" ").map(w=>`<span class="m">${[...w].map(c=>`<span class="ch" style="transition-delay:${(d+=.028).toFixed(3)}s">${c}</span>`).join("")}</span>`).join(" ");
document.getElementById("app").innerHTML=`
<nav><a href="#" class="u" style="font-weight:800">KD©</a><span class="t" id="clk"></span><div class="l"><a href="#work">Work</a><a href="#how">Process</a><a href="#xp">Experience</a><a href="${P.links.resume}" target="_blank" rel="noopener">Résumé</a><a href="#contact">Contact</a></div></nav>
<header class="w hero"><p class="mono" style="margin-bottom:24px">● ${P.available}</p>
<h1 class="u" aria-label="I build AI that listens, reads and talks back"><span class="row" data-s="-0.25" aria-hidden="true">${split("I build AI that")}</span><span class="row" data-s="0.2" aria-hidden="true">${split("listens, reads")}</span><span class="row" data-s="-0.15" aria-hidden="true">${split("& talks back")}</span></h1>
<div class="bt"><p>${P.intro}</p><div class="r"><a class="btn btn1 mag" data-c="Email" href="mailto:${P.email}?subject=Project%20enquiry">Start a project ↗</a><a class="btn btn2 mag" href="#work">Work ↓</a></div></div></header>
<div class="mq" aria-hidden="true"><div class="t" id="mq">${sk.concat(sk).map(s=>`<span>${s}</span>`).join("")}</div></div>
<div class="w"><div class="stats">${P.stats.map(s=>`<div class="rv"><b class="cnt" data-v="${s.value}">${s.value}</b><span class="mono">${s.label}</span></div>`).join("")}</div></div>
<section class="reel" id="work" style="--n:${P.cases.length}"><div class="stick"><div class="hd"><h2 class="u">Selected work</h2><span class="mono">Keep scrolling →</span></div>
<div class="track" id="track">${P.cases.map((c,i)=>`<article class="card" data-c="Case ${pad(i+1)}"><span class="bgn">${pad(i+1)}</span><div class="tx"><span class="mono">${pad(i+1)} / ${c.kind}</span><h3>${c.name}</h3><p class="tg">${c.tagline}.</p><p class="ap">${c.problem} ${c.approach}</p><p class="imp">↗ ${c.impact}</p><div class="tags">${c.stack.map(s=>`<span>${s}</span>`).join("")}</div></div><div class="vz">${MOCKS.render(i)}</div></article>`).join("")}</div>
<div class="prog"><i id="prog"></i><b id="pn">01 / ${pad(P.cases.length)}</b></div></div></section>
<div class="w">
<section class="s"><div class="sh"><h2 class="u">Archive</h2><span class="mono">${P.projects.length} more projects</span></div>
<ul class="pl">${P.projects.map(p=>`<li data-c="${p.url?"Open":p.tag.split(" · ")[0]}"><b>${p.url?`<a href="${p.url}" target="_blank" rel="noopener">${p.name} ↗</a>`:p.name}</b><span>${p.desc}</span><span class="mono">${p.tag}</span></li>`).join("")}</ul><p class="mono" style="margin-top:16px;text-transform:none">${P.ndaNote}</p></section>
<section class="s"><div class="sh"><h2 class="u">Services</h2></div><div class="svc">${P.services.map((s,i)=>`<div class="rv"><span class="mono" style="color:var(--ac)">${pad(i+1)}</span><h3>${s.title}</h3><p>${s.desc}</p></div>`).join("")}</div></section>
<section class="s" id="how"><div class="sh"><h2 class="u">How I work</h2><span class="mono">From first call to production</span></div><ul class="proc">${P.process.map((s,i)=>`<li class="rv"><span class="n">${pad(i+1)}</span><h3>${s.step}</h3><p>${s.desc}</p></li>`).join("")}</ul></section>
<section class="s" id="xp"><div class="sh"><h2 class="u">Experience</h2><span class="mono">${P.education.degree} · ${P.education.detail}</span></div>
<ul class="xp">${P.experience.map(e=>`<li class="rv"><div><p class="mono" style="color:var(--fg)">${e.when}</p><p class="mono" style="margin-top:6px">${e.place}</p></div><div><h3>${e.role} <span>/ ${e.org}</span></h3><ul>${e.points.map(p=>`<li>${p}</li>`).join("")}</ul>${e.stack?`<p class="mono" style="margin-top:16px">${e.stack}</p>`:""}</div></li>`).join("")}</ul></section>
<section class="ct" id="contact"><p class="mono">Got something that should talk?</p><h2 class="u" style="margin-top:24px" data-c="Say hi">Let's<span class="fill">build it.</span></h2>
<a class="em mag" data-c="Email" href="mailto:${P.email}?subject=Project%20enquiry">${P.email}</a>
<p class="mono" style="margin-top:40px;display:flex;gap:28px;justify-content:center;flex-wrap:wrap"><a href="${P.links.linkedin}" target="_blank" rel="noopener">LinkedIn ↗</a><a href="${P.links.github}" target="_blank" rel="noopener">GitHub ↗</a><a href="${P.links.resume}" target="_blank" rel="noopener">Résumé ↗</a></p></section>
<p class="mono" style="display:flex;justify-content:space-between;padding:24px 0;border-top:1px solid var(--line)"><span>© ${new Date().getFullYear()} ${P.name}</span><span>${P.location} · ${P.timezone}</span></p></div>`;

// loader (once per visit)
const ld=$("#ld");let seen=false;try{seen=sessionStorage.getItem("kd-ld")==="1";sessionStorage.setItem("kd-ld","1");}catch(e){}
const start=()=>document.body.classList.add("go");
if(still||seen){ld.remove();requestAnimationFrame(()=>requestAnimationFrame(start));}
else{const t0=performance.now(),D=1500,n=$("#ldn"),b=$("#ldb");(function f(t){const k=Math.min(1,(t-t0)/D),e=1-Math.pow(1-k,3);n.textContent=String(Math.round(e*100)).padStart(3,"0");b.style.width=e*100+"%";if(k<1)requestAnimationFrame(f);else{ld.classList.add("out");setTimeout(start,250);setTimeout(()=>ld.remove(),1100);}})(t0);}

// reveals, mockups, counters
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{rootMargin:"0px 0px -8% 0px"});$$(".rv").forEach(el=>io.observe(el));
MOCKS.observe();
const cio=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;cio.unobserve(e.target);const el=e.target,raw=el.dataset.v,m=raw.match(/[\d.,]+/);if(!m||still)return;const n=parseFloat(m[0].replace(/,/g,"")),d=(m[0].split(".")[1]||"").length,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/1400),v=n*(1-Math.pow(1-k,4));el.textContent=raw.replace(m[0],d?v.toFixed(d):Math.round(v).toLocaleString("en-US"));if(k<1)requestAnimationFrame(f);})(t0);}),{threshold:.6});$$(".cnt").forEach(el=>cio.observe(el));
const clk=$("#clk"),tick=()=>clk.textContent=new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Kolkata"})+" IST · Indore";tick();setInterval(tick,20000);

// scroll-driven motion
const rows=$$(".hero .row"),mq=$("#mq"),reel=$("#work"),track=$("#track"),prog=$("#prog"),pn=$("#pn"),cards=$$(".card");
const flatMQ=matchMedia("(max-width: 760px)");const setFlat=()=>reel.classList.toggle("flat",still||flatMQ.matches);setFlat();flatMQ.addEventListener("change",setFlat);
let mqx=0,last=scrollY,vel=0;
function frame(){const y=scrollY;vel=vel*0.85+(y-last)*0.15;last=y;
 if(!still){rows.forEach(r=>r.style.transform=`translateX(${y*parseFloat(r.dataset.s)}px)`);
  mqx-=1+Math.abs(vel)*0.5;const half=mq.scrollWidth/2;if(-mqx>half)mqx+=half;mq.style.transform=`translateX(${mqx}px)`;
  if(!reel.classList.contains("flat")){const r=reel.getBoundingClientRect(),total=reel.offsetHeight-innerHeight,p=Math.min(1,Math.max(0,-r.top/total)),max=track.scrollWidth-innerWidth+40;
   track.style.transform=`translateX(${-p*Math.max(0,max)}px) skewX(${Math.max(-6,Math.min(6,-vel*0.12))}deg)`;prog.style.width=p*100+"%";pn.textContent=pad(Math.min(cards.length,1+Math.floor(p*cards.length*0.999)))+" / "+pad(cards.length);}}
 requestAnimationFrame(frame);}
requestAnimationFrame(frame);

// cursor with contextual labels + magnetic buttons
const cur=$("#cur"),curt=$("#curt");if(matchMedia("(hover:hover)").matches){let cx=innerWidth/2,cy=innerHeight/2,tx=cx,ty=cy;
 addEventListener("pointermove",e=>{tx=e.clientX;ty=e.clientY;},{passive:true});
 (function c(){cx+=(tx-cx)*.18;cy+=(ty-cy)*.18;cur.style.left=cx+"px";cur.style.top=cy+"px";requestAnimationFrame(c);})();
 document.addEventListener("pointerover",e=>{const t=e.target.closest("[data-c],a,button");cur.classList.remove("lbl","big");if(!t)return;if(t.dataset.c){curt.textContent=t.dataset.c;cur.classList.add("lbl");}else cur.classList.add("big");});
 $$(".mag").forEach(b=>{b.addEventListener("pointermove",e=>{const r=b.getBoundingClientRect();b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.3}px,${(e.clientY-r.top-r.height/2)*.4}px)`;});b.addEventListener("pointerleave",()=>b.style.transform="");});}
})();
</script>
<script src="/assets/switcher.js" defer></script>
</body>
</html>
